# ============================================================
# 文献清单（唯一事实源）。字段：
#   id          必填，前缀须等于 project.id_prefix
#   title / url / chapter / section   必填（chapter = chapters.folder，section = 小节 id）
#   publisher   发布主体（无个人作者时写机构；参考文献里作者缺省回退到它）
#   author      可选。禁止写 et al.，请补全或留空（arXiv 会自动回填作者）
#   date        发布时间（取前 4 位作为年份）
#   lit_type / credibility / tags   说明性字段
#   ref_type    参考文献类型标识，默认 EB/OL（期刊可写 J）
#   alias_for   镜像文献：写主文献编号，正文引用会自动归并到主编号
#   related_urls  同一成果的关联入口（如项目站 + 论文），会一并抓取拼接
#   local_file  本地正文（相对本目录，md/txt/pdf）；有它则不联网
# ============================================================
literatures:
  - id: "XX01"
    title: "示例文献标题"
    url: "https://example.com/paper-1"
    publisher: "示例机构"
    date: "2025-01-01"
    lit_type: "论文"
